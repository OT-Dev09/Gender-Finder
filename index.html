<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="shortcut icon" href="image/bot.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>

    <div class="modal fade" id="welcomeModal" tabindex="-1" aria-label="Connect with the developer" aria-hidden="true"
        data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center" style="border: 2px solid #4b5320;">
                <div class="modal-body py-4 px-4">
                    <!-- <p class="mb-2">Connect With The Developer on TIKTOK@
                        <a href="https://www.tiktok.com/@4tok__" target="_blank"
                            rel="noopener noreferrer">Click-Me</a>
                    </p> -->
                    <p class="mb-4">Connect With The Developer on X/Twitter@
                        <a href="https://x.com/just_4pf?s=11" target="_blank" rel="noopener noreferrer">Click-Me</a>
                    </p>
                    <button type="button" id="welcomeBtn" class="btn bg-success btn-olive btn-lg px-5"
                        data-bs-dismiss="modal">Continue</button>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-11 col-sm-9 col-md-7 col-lg-5 bg-success p-4 rounded shadow text-center">
                <h1 class="mb-3">Gender-Finder</h1>
                <input class="form-control text-center mb-3" type="text" id="gender" placeholder="input your sex here">
                <div id="display">

                </div>
                <button class="btn btn-outline-light px-4" style="color: black;" onClick="search()">search</button>
            </div>
        </div>
    </div>


    <script src="Script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function () {
            var el = document.getElementById("welcomeModal");
            if (!el || typeof bootstrap === "undefined") return;
            new bootstrap.Modal(el).show();
        })();
    </script>
</body>

</html>
